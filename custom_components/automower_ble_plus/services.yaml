set_work_area_mowing:
  target:
    entity:
      integration: automower_ble_plus
      domain: lawn_mower
  fields:
    mission_id:
      required: true
      selector:
        number:
          min: 0
          max: 4294967295
          step: 1
          mode: box
    mowing_pattern:
      selector:
        select:
          translation_key: mowing_pattern
          options:
            - random
            - systematic
    orientation:
      selector:
        number:
          min: -360
          max: 360
          step: 0.1
          unit_of_measurement: "°"
          mode: box
    orientation_shift:
      selector:
        number:
          min: -360
          max: 360
          step: 0.1
          unit_of_measurement: "°"
          mode: box
    boundary_mowing:
      selector:
        boolean:
    cutting_height:
      selector:
        number:
          min: 0
          max: 100
          step: 1
          mode: box
    use_global_cutting_height:
      selector:
        boolean:
    vision_positioning:
      selector:
        boolean:
    use_global_vision_positioning:
      selector:
        boolean:
    daylight_only:
      selector:
        boolean:
    use_global_daylight_only:
      selector:
        boolean:
    boundary_edge_detection:
      selector:
        boolean:
    use_global_boundary_edge_detection:
      selector:
        boolean:
    obstacle_avoidance:
      selector:
        boolean:
    use_global_obstacle_avoidance:
      selector:
        boolean:
    obstacle_avoidance_at_boundary:
      selector:
        boolean:
    use_global_obstacle_avoidance_at_boundary:
      selector:
        boolean:
    vision_obstacle_profile:
      selector:
        select:
          translation_key: area_vision_profile
          options:
            - default_pro
            - risk_objects_only
            - residential_garden
    use_global_vision_obstacle_profile:
      selector:
        boolean:
    priority:
      selector:
        select:
          translation_key: work_area_priority
          options:
            - lowest
            - low
            - medium
            - high
            - highest
